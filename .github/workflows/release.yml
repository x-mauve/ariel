name: Release

on:
  push:
    tags: ['v*']
  # A manual run on a tag publishes that release; on a branch it builds a
  # snapshot and keeps the binaries as workflow artifacts only.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser derives the version and the previous tag from history.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Extract release notes
        if: github.ref_type == 'tag'
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build snapshot
        if: github.ref_type != 'tag'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: release --snapshot --clean

      - name: Upload snapshot
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: ariel-snapshot
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
