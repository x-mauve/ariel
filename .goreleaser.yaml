# GoReleaser configuration; see https://goreleaser.com/customization/.
version: 2

project_name: ariel

builds:
  - id: ariel
    main: .
    binary: ariel
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    # Reproducible builds: file times come from the commit, not the build host.
    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

# Release notes come from CHANGELOG.md through --release-notes, which replaces
# the generated changelog. Do not set changelog.disable: it also skips reading
# the --release-notes file and leaves the release body empty.

release:
  prerelease: auto
